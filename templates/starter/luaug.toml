# The project file (api-design.md §4).

[project]
name = "{{name}}"
# Reverse-DNS, so two games with the same name are still two games.
id = "dev.local.{{name}}"
version = "0.1.0"
# The world the project starts with, relative to `content/`. Its scripts are
# in it too, inside the instances they belong to (ADR 0092).
scene = "scenes/main.scene.json"
# The game's own icon, embedded by `luaug build` -- a multi-size `.ico` on
# Windows. Without it a built game wears the engine's.
# icon = "assets/icon.ico"

[window]
title = "{{name}}"
size = [1280, 720]

[graphics]
# The quality preset (ADR 0044): "low", "medium", "high" or "ultra". A key
# below overrides the preset, and `luaug run --quality=...` overrides both.
quality = "high"
# render_scale = 1.0        # 0.5 to 1.0; the world renders at this fraction, the UI does not
# shadow_distance = 120.0   # metres
# bloom = true
# ambient_occlusion = true
