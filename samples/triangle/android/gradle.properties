# AGP 8 defaults that are only defaults -- stated so this build does not change
# meaning the day a future plugin version flips one.
android.useAndroidX=true
android.nonTransitiveRClass=true

# No Java toolchain is declared anywhere in this project, so Gradle compiles
# with the JDK it is running on -- AGP 8.7 requires 17, and the nightly installs
# exactly that. This line makes the absence explicit: if a toolchain is ever
# declared and missing, the build says so instead of silently downloading a JDK
# nothing pinned (R5).
org.gradle.java.installations.auto-download=false

org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8

# One module, no independent work to overlap: parallel execution would buy a
# second worker for nothing.
org.gradle.parallel=false
