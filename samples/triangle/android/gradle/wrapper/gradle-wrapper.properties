# The Gradle version this project is built with (R5). Same distribution the
# vendored SDL3 android-project wrapper names, so the AGP/Gradle pair here is a
# combination upstream already ships.
#
# The wrapper JAR and the `gradlew` scripts are deliberately NOT committed: they
# are a 60 KB binary blob and two generated launchers, and this repository has
# no binary content policy yet (the M4 brief lists the first binary asset as a
# question for the human). Provision Gradle instead:
#
#   * CI: gradle/actions/setup-gradle, reading the version out of this file.
#   * Locally: Android Studio, or any Gradle 8.12, or `gradle wrapper` once --
#     which regenerates the jar and the launchers from exactly this line.
distributionBase=GRADLE_USER_HOME
distributionPath=wrapper/dists
distributionUrl=https\://services.gradle.org/distributions/gradle-8.12-bin.zip
zipStoreBase=GRADLE_USER_HOME
zipStorePath=wrapper/dists
