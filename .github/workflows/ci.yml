name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ---------------------------------------------------------------------------
  # ACTIVE NOW (docs-first phase): keeps the documentation package itself
  # verifiable — every relative link resolves, pinned versions are consistent,
  # no stray Roblox references outside the allowed files (rule R7 sweep).
  # ---------------------------------------------------------------------------
  # NOTE ON `--exclude-dir=third_party` BELOW: every step in this job checks
  # documentation *we* authored. Vendored upstream trees are governed by
  # ADR 0021 (pinned + never edited in place, R13), carry their own licenses,
  # and legitimately contain both broken relative links and the word "Roblox"
  # (Luau is a Roblox project). Linting them would be meaningless and a
  # permanent source of false failures.
  docs-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check relative links in markdown
        shell: bash
        run: |
          set -euo pipefail
          fail=0
          while IFS=: read -r file link; do
            target="${link%%#*}"
            [[ -z "$target" ]] && continue
            base="$(dirname "$file")"
            if [[ ! -e "$base/$target" && ! -e "$target" ]]; then
              echo "::error file=$file::broken relative link: $link"
              fail=1
            fi
          done < <(grep -RnoE '\]\(([^)#h][^):]*)\)' --include='*.md' \
                   --exclude-dir=third_party . \
                   | sed -E 's/^([^:]+):[0-9]+:\]\(([^)]*)\)/\1:\2/' )
          exit $fail

      - name: Version-consistency grep (pinned versions named identically everywhere)
        shell: bash
        run: |
          set -euo pipefail
          check() { # pattern, forbidden-conflicting-pattern, label
            if grep -RnE "$2" --include='*.md' --include='*.toml' --include='*.json' \
                 --exclude-dir=.git --exclude-dir=third_party . ; then
              echo "::error::version inconsistency for $3 (found '$2'; expected only '$1')"
              exit 1
            fi
          }
          # Luau pin is 0.734 — flag any other 0.7xx presented as "the pin"
          check "0.734" "pinned to 0\.7(0|1|2)[0-9]" "Luau"
          # Lute pin is 1.0.0
          check "lute@1.0.0" "lute@0\." "Lute"
          # luau-lsp pin is 1.69.0
          check "luau-lsp@1.69.0" "luau-lsp@1\.6[0-8]\." "luau-lsp"
          echo "version consistency ok"

      - name: Legal sweep (R7) — 'Roblox' only in allowed files
        shell: bash
        run: |
          set -euo pipefail
          allowed='^(\./)?(README\.md|CONTRIBUTING\.md|NOTICE|MASTER_PROMPT\.md|CLAUDE\.md|PROGRESS\.md|docs/|templates/README\.md|examples/README\.md|tests/README\.md|runtime/README\.md|api/README\.md|engine/README\.md|tools/README\.md|third_party/README\.md)'
          bad=0
          while IFS= read -r f; do
            if ! [[ "$f" =~ $allowed ]]; then
              echo "::error file=$f::'Roblox' referenced outside the allowed docs set (rule R7)"
              bad=1
            fi
          done < <(grep -RliE 'roblox' --exclude-dir=.git --exclude-dir=.github \
                     --exclude-dir=third_party . || true)
          exit $bad

      - name: Ledger format sanity
        shell: bash
        run: |
          for h in "## State" "## Now / Next" "## Blocked" "## Session Log"; do
            grep -q "$h" PROGRESS.md || { echo "::error::PROGRESS.md missing section '$h'"; exit 1; }
          done
          echo "ledger ok"

